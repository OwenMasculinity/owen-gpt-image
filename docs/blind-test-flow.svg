<svg viewBox="0 0 680 476" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>九宫格盲测流程</title>
<desc>用户说不出风格名时，一次检索出九种不同风格的候选并编号，用户指认其中一张，系统只生成选中的这一张。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="240" y="40" width="200" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">用户：「要高级感」</text>

<path d="M340 84L340 116" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="102" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">检索，不是生成</text>

<rect x="218" y="120" width="76" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="256" y="151" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">1</text>
<text x="256" y="172" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5F5E5A">无印良品</text>

<rect x="302" y="120" width="76" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="151" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">2</text>
<text x="340" y="172" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5F5E5A">Rams</text>

<rect x="386" y="120" width="76" height="76" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
<text x="424" y="151" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">3</text>
<text x="424" y="172" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#854F0B">Sander</text>

<rect x="218" y="204" width="76" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="256" y="235" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">4</text>
<text x="256" y="256" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5F5E5A">Apple</text>

<rect x="302" y="204" width="76" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="235" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">5</text>
<text x="340" y="256" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5F5E5A">吉卜力</text>

<rect x="386" y="204" width="76" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="424" y="235" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">6</text>
<text x="424" y="256" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5F5E5A">Penguin</text>

<rect x="218" y="288" width="76" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="256" y="319" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">7</text>
<text x="256" y="340" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5F5E5A">故宫文创</text>

<rect x="302" y="288" width="76" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="319" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">8</text>
<text x="340" y="340" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5F5E5A">赛博朋克</text>

<rect x="386" y="288" width="76" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="424" y="319" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">9</text>
<text x="424" y="340" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5F5E5A">月份牌</text>

<path d="M340 364L340 396" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="382" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">「我要 3 号」</text>

<rect x="200" y="400" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="420" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">只生成选中的那 1 张</text>
<text x="340" y="440" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">选中的那张就是 ref 垫图</text>
</svg>
